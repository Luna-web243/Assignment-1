<!DOCTYPE html>
<html>
<head>
    <title>Home Page</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .container {
            text-align: center;
            margin-top: 150px;
        }

        h1 {
          font-size: 45px;
          color: white;
          -webkit-text-stroke: 2px black;
}

        p {
            font-size: 20px;
        }

        .button-group button {

            width: 260px;
            padding: 15px;
            margin: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background-color: black;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .button-group button:hover {

            background-color: #555;
            transform: scale(1.05);

        }

    </style>
</head>
<body>

    <div class="container">

        <h1>Selamat Datang</h1>

        <p>Sila pilih bahagian:</p>

                <button>Home</button>
            </a>

                <button>About</button>
            </a>
			
            <br>
            <a href="role.html">
                <button>Role</button>
            </a>
        </div>
    </div>
</body>
</html>
